services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: luxshop
      POSTGRES_USER: luxshop
      POSTGRES_PASSWORD: change-this-password
    ports:
      - "5432:5432"
    volumes:
      - luxshop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U luxshop -d luxshop"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  luxshop-postgres:
